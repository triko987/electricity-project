{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | EnergySync</title>

    <link rel="stylesheet"
          href="{% static 'consumption/css/login.css' %}">

    <style>
        .forgot-description {
            color: #64748b;
            text-align: center;
            font-size: 14px;
            line-height: 1.6;
            margin: 15px 0 25px;
        }

        .forgot-button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            border: none;
            border-radius: 9px;
            background: #15803d;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .forgot-button:hover {
            background: #166534;
        }

        .back-login {
            display: block;
            text-align: center;
            margin-top: 22px;
            color: #15803d;
            text-decoration: none;
            font-size: 14px;
        }

        .back-login:hover {
            text-decoration: underline;
        }

        .forgot-error {
            color: #dc2626;
            font-size: 13px;
            margin-top: 6px;
        }

        .forgot-input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 9px;
            outline: none;
            font-size: 14px;
            margin-top: 8px;
        }

        .forgot-input:focus {
            border-color: #15803d;
            box-shadow: 0 0 0 3px rgba(21,128,61,.1);
        }
    </style>
</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-icon">⚡</div>

        <h1>Forgot Password?</h1>

        <p class="forgot-description">
            Don't worry! Enter your registered email address
            and we'll send you a link to reset your password.
        </p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">

                <label for="id_email">Email Address</label>

                <input
                    type="email"
                    name="email"
                    id="id_email"
                    class="forgot-input"
                    placeholder="Enter your registered email"
                    autocomplete="email"
                    required
                >

                {% for error in form.email.errors %}
                    <div class="forgot-error">{{ error }}</div>
                {% endfor %}

            </div>

            <button type="submit" class="forgot-button">
                Send Reset Link →
            </button>

        </form>

        <a href="{% url 'login' %}" class="back-login">
            ← Back to Login
        </a>

        <div class="login-footer">
            <span></span>
            <p>🌿 Powering a Sustainable Future</p>
            <span></span>
        </div>
