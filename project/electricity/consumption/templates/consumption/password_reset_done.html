
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email | EnergySync</title>

    <link rel="stylesheet" href="{% static 'consumption/css/login.css' %}">
</head>
<body>

    <div style="max-width: 500px; margin: 100px auto; padding: 35px; background: white; border-radius: 15px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.08);">

        <h2 style="color: #166534;">Check Your Email</h2>

        <p style="color: #64748b; margin: 20px 0;">
            If an account exists with the email address you entered, you will receive a password reset link shortly.
        </p>

        <a href="{% url 'login' %}" style="display: inline-block; padding: 12px 25px; background: #15803d; color: white; text-decoration: none; border-radius: 8px;">
            Back to Login
        </a>

    </div>

</body>
</html>
